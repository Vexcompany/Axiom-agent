name = "axiom-chat-worker"
main = "src/index.ts"
compatibility_date = "2025-07-18"
compatibility_flags = ["nodejs_compat"]

# Secrets (wrangler secret put):
# GEMINI_API_KEY          — Google AI Studio key #1 → Gemini 3.5 Flash-Lite
# GEMINI_36_API_KEY       — Google AI Studio key #2 → Gemini 3.6 Flash (other account)
# SENSENOVA_API_KEY       — SenseNova (token.sensenova.ai)
# GROQ_API_KEY
# OPENROUTER_API_KEY
# CEREBRAS_API_KEY
# GITHUB_APP_ID           — GitHub tools (Worker-side agent loop)
# GITHUB_PRIVATE_KEY      — PEM; newlines as \n ok
# Optional: GITHUB_BOT_NAME, GITHUB_BOT_EMAIL, SEKAI_API_KEY

[vars]
# ALLOWED_ORIGINS = "*"
# GEMINI_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/openai"
# SENSENOVA_BASE_URL = "https://token.sensenova.ai/v1"
